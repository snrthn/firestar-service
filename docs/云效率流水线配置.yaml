name: firestar-service
# ========== 代码源（sources）==========
# 写法依据：type:codeup 私有源需 endpoint + branch + certificate.serviceConnection
# 注意：repo / version / serviceConnection 是「ArtifactUpload 步骤」的字段，不是 sources 的！
sources:
  my_repo:
    type: codeup
    name: firestar-service
    endpoint: https://codeup.aliyun.com/6923140d3b25a962b43a7ff4/firestar-service.git
    branch: main
    triggerEvents:
      - push
    # ⚠️ 触发分支过滤（PaC 模式下这是 YAML 字段，不是「触发设置」UI 开关）
    #    不写此字段 = 任意分支 push 都触发。支持正则：^main$ | ^main$|^release/.*
    branchesFilter: ^main$
    certificate:
      type: serviceConnection
      # ⚠️ 复用 be-media-man-system 同账号的 Codeup 代码源连接；若云效校验报"连接无效"再新建
      serviceConnection: bii4ow7cqitmb438

stages:
  build_stage:
    name: 测试与构建
    jobs:
      test_job:
        name: 代码扫描与单元测试
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        condition: |
          "${ACTION}" == "deploy"
        steps:
          setup_java_step:
            step: SetupJava
            name: 安装 JDK17 + Maven
            with:
              jdkVersion: '17'
              # ⚠️ 版本不能随便填：云效 SetupJava 的 mavenVersion 是白名单，只接受
              #    2.2.1 | 3.2.5 | 3.5.2 | 3.6.1 | 3.6.3 | 3.8.4 | 3.9.3
              #    （填 3.9.9 会被云效直接校验拒绝，yaml-schema 报错）
              # 下限原因：Spring Boot 3.3.4 parent 锁定 maven-compiler-plugin 3.13.0，
              #    它硬性要求 Maven ≥ 3.6.3 —— 3.5.2 会在编译阶段报
              #    "maven-compiler-plugin 3.13.0 requires Maven version 3.6.3"
              mavenVersion: '3.9.3'
          p3c_step:
            step: JavaP3CScan
            name: Java 代码规约扫描
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
              # 增量扫描（2026-10-20 虎哥要求开启）：默认 false=全量；
              # true=基于 push diff 只扫改动文件，问题直接关联提交人。
              # ⚠️ 代价：跨文件引用类问题查不出来；历史存量问题不再暴露。
              incrementalScan: true
          unit_test_step:
            step: Command
            name: Maven 单元测试
            with:
              run: |
                set -e
                # =====================================================================
                # 自包含 MySQL sidecar —— 根治「集成测试全 Error / 被降级跳」根因
                # ---------------------------------------------------------------------
                # 根因：所有测试都是 @ActiveProfiles("dev")，dev profile 连
                #   jdbc:mysql://127.0.0.1:3306/firestar 且开启 Flyway。CI 构建容器
                #   里没有 MySQL 实例 → Connection refused → HikariCP 30s+ 超时 →
                #   Spring 上下文加载失败 → 35 个测试里 29 个 Error。旧流水线用
                #   -Dmaven.test.failure.ignore=true 把这些真错误「降级」成假绿。
                #
                # 修复：本步骤自带一个 MySQL 容器作 sidecar，dev profile 通过
                #   DB_HOST/DB_USERNAME/DB_PASSWORD 环境变量连它（application-dev.properties
                #   已支持 ${DB_HOST:127.0.0.1} / ${DB_USERNAME:root} / ${DB_PASSWORD}）；
                #   并把 failure.ignore 改为 false，让测试真正发挥门禁作用。
                #
                # ⚠️ 前提：云效公共构建集群需开放 docker（云效镜像构建即依赖它，
                #   通常默认开放）。若 CI 报 docker: command not found / permission
                #   denied，说明该集群未开放 docker —— 请改为在云效控制台 UI 为
                #   test_job 添加「MySQL 服务容器」(MYSQL_ROOT_PASSWORD 与上述
                #   DB_PASSWORD 一致, MYSQL_DATABASE=firestar)，并把下方
                #   export DB_HOST 改成该服务容器的 hostname（云效服务容器默认在
                #   127.0.0.1 可达）。
                # =====================================================================
                export DB_HOST=127.0.0.1
                export DB_PORT=3306
                export DB_USERNAME=root
                export DB_PASSWORD=firestar_ci_2026
                docker run -d --name ci-mysql -p 3306:3306 \
                  -e MYSQL_ROOT_PASSWORD=firestar_ci_2026 \
                  -e MYSQL_DATABASE=firestar \
                  -e MYSQL_ROOT_HOST=% \
                  mysql:8.0 --default-authentication-plugin=mysql_native_password
                # 等待 MySQL 就绪（最多 60s），避免 flyway 在库未起时连不上而超时
                for i in $(seq 1 60); do
                  if docker exec ci-mysql mysqladmin ping -h 127.0.0.1 -uroot -pfirestar_ci_2026 2>/dev/null | grep -q "alive"; then
                    echo "[ci-mysql] ready after ${i}s"; break
                  fi
                  sleep 1
                done
                docker exec ci-mysql mysqladmin ping -h 127.0.0.1 -uroot -pfirestar_ci_2026
                mvn -B test -Dmaven.test.failure.ignore=false
                mvn surefire-report:report-only
                mvn site -DgenerateReports=false
      build_job:
        name: Java 构建
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        needs:
          - test_job
        condition: |
          "${ACTION}" == "deploy"
        steps:
          setup_java_step:
            step: SetupJava
            name: 安装 JDK17 + Maven
            with:
              jdkVersion: '17'
              # 同上：白名单 + 必须 ≥3.6.3，理由见 test_job 的注释
              mavenVersion: '3.9.3'
          build_step:
            step: Command
            name: Java 构建并打包
            with:
              run: |
                mvn -B clean package -DskipTests
                cp -r bin target/bin
                rm -rf target/classes target/generated-sources target/maven-archiver target/maven-status target/test-classes
          upload_step:
            step: ArtifactUpload
            name: 构建物上传
            with:
              uploadType: packages
              # ⚠️ 必须是「制品仓库(packages)连接」，不是 Codeup 代码源连接！
              serviceConnection: ystkn5uj361puwbk
              repo: flow_generic_repo
              artifact: default
              filePath:
                - target/
              version: "${BUILD_NUMBER}"

  deploy_stage:
    name: 部署
    jobs:
      deploy_job:
        name: 主机组部署
        component: VMDeploy
        condition: |
          "${ACTION}" == "deploy"
        with:
          artifact: $[stages.build_stage.build_job.upload_step.artifacts.default]
          # 机器组：与 be-media-man-system 同台 ECS（复用）；若换服务器需新建机器组并替换 UUID
          machineGroup: "qTjw4VWk6jWcfPpO"
          artifactDownloadPath: /home/admin/be-firestar/package.tgz
          executeUser: root
          run: |
            mkdir -p /usr/local/server/java/firestar
            tar zxvf /home/admin/be-firestar/package.tgz -C /usr/local/server/java/firestar --strip-components=1
            bash /usr/local/server/java/firestar/bin/deploy.sh

  ops_stage:
    name: 运维
    jobs:
      ops_job:
        name: 启停控制
        component: VMDeploy
        condition: |
          "${ACTION}" != "deploy"
        with:
          machineGroup: "qTjw4VWk6jWcfPpO"
          downloadArtifact: false
          executeUser: root
          run: |
            set -e
            ACTION="${ACTION:-restart}"
            PORT="${DEPLOY_PORT:-2025}"
            # ⚠️ 2026-10-19 起 /actuator/health 需要认证，匿名轮询会拿到 401 被判「启动超时」。
            #    门禁统一用 liveness（只验进程存活 + 磁盘，不碰数据库），与 deploy.sh 一致。
            HEALTH_PATH="${HEALTH_PATH:-/actuator/health/liveness}"
            cd /usr/local/server/java/firestar
            case "$ACTION" in
              stop)    bash bin/stop.sh ;;
              start)   bash bin/start.sh "$PORT" "$HEALTH_PATH" ;;
              restart) bash bin/stop.sh && bash bin/start.sh "$PORT" "$HEALTH_PATH" ;;
            esac
