name: firestar-service
sources:
  my_repo:
    type: codeup
    name: firestar-service
    endpoint: https://codeup.aliyun.com/6923140d3b25a962b43a7ff4/firestar-service.git
    branch: main
    triggerEvents:
      - push
    branchesFilter: ^main$
    certificate:
      type: serviceConnection
      serviceConnection: bii4ow7cqitmb438

# ========== 门禁契约（2026-11-14）==========
# 目标：test / build / deploy 任一环失败，流程立即中断，绝不「跳过继续往后跑」。
# 依据：云效 jobs 文档（help.aliyun.com/zh/yunxiao/user-guide/pipelined-task-jobs，
#       2026-10-24 更新）：
#   - condition 非必填，默认值是「前序依赖任务全部成功后才执行本任务」；
#     一旦显式写 condition，该默认值即被覆盖。只写 "${ACTION}" == "deploy"
#     等于把默认门禁关掉 → 测试/构建失败时部署仍会被调度。
#     故部署链每个下游 job 都显式补 "&& succeed()"（无入参 = 前序所有任务）。
#   - continueOnFail 默认 false（任务失败后不执行后续任务），这里显式写出便于审计。
#   - Command / VMDeploy 的 run 是多行 shell，必须自带 set -e，否则非最后一条
#     命令失败会被后续命令的成功退出码掩盖（step 假绿）。
# ops_stage 是 ACTION!=deploy 的独立分支，刻意不加 succeed()：那条路径下
# test/build/deploy 全部 SKIP，加 succeed() 会把运维启停一并卡死。
stages:
  build_stage:
    name: 测试与构建
    jobs:
      test_job:
        name: 代码扫描与单元测试
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        # 部署链首环，无前序依赖；失败即中断后续所有任务
        continueOnFail: false
        condition: |
          "${ACTION}" == "deploy"
        steps:
          setup_java_step:
            step: SetupJava
            name: 安装 JDK17 + Maven
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
          p3c_step:
            step: JavaP3CScan
            name: Java 代码规约扫描
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
              incrementalScan: true
          unit_test_step:
            step: Command
            name: Maven 单元测试
            with:
              run: |
                set -e
                # =====================================================================
                # CI 门禁：云效 alinux3 构建容器无 MySQL 实例，这里只跑纯单测
                # =====================================================================
                # 集成测试已迁到 it profile + firestar_test 独立库（不碰 dev 库，
                # schema 由 Flyway 从空库全量重放自建），在带 MySQL 的本地或
                # 自建 CI 环境执行：bash scripts/run-integration-tests.sh
                # 下列集成测试类仍需 MySQL，故不在本 job 运行：
                #   - ApiDocsClosedTest: 需要 Spring 上下文 + 数据库
                #   - DatabaseCheckEndpointTest: 需要数据库
                #   - DatabaseCheckServiceTest: 需要数据库
                #   - EntityMappingConsistencyTest: 需要数据库
                #   - MybatisPlusSmokeTest: 需要数据库
                #   - SecurityExposureTest: 需要 Spring 上下文
                #
                # 保留的测试类（纯单元测试，不需要数据库）：
                #   - SmokeTest: 纯单元测试
                #   - AuthControllerStreamTest: Mock 测试
                #   - AuditDictConsistencyTest: 静态扫描 @Auditable 注解 ↔ sys_dict_data
                #     字典的双向差集（枚举漏补字典就 fail），不连库、不需要 MySQL。
                #     见 firestar-core/src/test/java/com/firestar/seed/
                # ⚠️ 多模块 reactor（core / biz / server）：-Dtest 会作用到每个模块，
                #    SmokeTest / AuthControllerStreamTest 只在 firestar-server，
                #    core / biz 零匹配会被 surefire 3.2.5 直接判失败，必须带
                #    -Dsurefire.failIfNoSpecifiedTests=false（bin/test.sh 里同款兜底）。
                # =====================================================================
                echo "[info] Running unit tests only (excluding integration tests that require MySQL)..."
                mvn -B test \
                  -Dtest='SmokeTest,AuthControllerStreamTest,AuditDictConsistencyTest,GlobalExceptionHandlerTest,LoginRateLimitFilterTest' \
                  -Dsurefire.failIfNoSpecifiedTests=false \
                  -Dmaven.test.failure.ignore=false
      build_job:
        name: Java 构建
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        needs:
          - test_job
        # 显式补 succeed()：condition 一旦显式声明，平台默认的「前序全成功」不再生效，
        # 不补就变成「test_job 失败也照跑构建」。
        continueOnFail: false
        condition: |
          "${ACTION}" == "deploy" && succeed()
        steps:
          setup_java_step:
            step: SetupJava
            name: 安装 JDK17 + Maven
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
          build_step:
            step: Command
            name: Java 构建并打包
            with:
              run: |
                set -e
                mvn -B clean package -DskipTests
                rm -rf staging && mkdir -p staging
                cp firestar-server/target/firestar-server-*.jar staging/
                cp -r bin staging/bin
          upload_step:
            step: ArtifactUpload
            name: 构建物上传
            with:
              uploadType: packages
              serviceConnection: ystkn5uj361puwbk
              repo: flow_generic_repo
              artifact: default
              filePath:
                - staging/
              version: "${BUILD_NUMBER}"

  deploy_stage:
    name: 部署
    jobs:
      deploy_job:
        name: 主机组部署
        component: VMDeploy
        # 部署链最后一环：test/build 任一 FAIL/CANCEL → succeed()=false → 本 job 不调度。
        # 「构建失败→无制品→部署报制品信息无效」退化为兜底，不再是唯一防线。
        continueOnFail: false
        condition: |
          "${ACTION}" == "deploy" && succeed()
        with:
          artifact: $[stages.build_stage.build_job.upload_step.artifacts.default]
          machineGroup: "qTjw4VWk6jWcfPpO"
          artifactDownloadPath: /home/admin/be-firestar/package.tgz
          executeUser: root
          run: |
            set -e
            mkdir -p /usr/local/server/java/firestar
            tar zxvf /home/admin/be-firestar/package.tgz -C /usr/local/server/java/firestar --strip-components=1
            bash /usr/local/server/java/firestar/bin/deploy.sh

  # ACTION!=deploy 的独立分支：此路径下 test/build/deploy 全 SKIP，
  # 故 ops_job 刻意不写 succeed()，否则运维启停会被「前序未成功」卡死。
  ops_stage:
    name: 运维
    jobs:
      ops_job:
        name: 启停控制
        component: VMDeploy
        condition: |
          "${ACTION}" != "deploy"
        with:
          machineGroup: "qTjw4VWk6jWcfPpO"
          downloadArtifact: false
          executeUser: root
          run: |
            set -e
            ACTION="${ACTION:-restart}"
            PORT="${DEPLOY_PORT:-2025}"
            HEALTH_PATH="${HEALTH_PATH:-/actuator/health/liveness}"
            # 与 deploy.sh:19 的默认值保持一致：ops_stage 直调 start.sh 时也走 prod，
            # 避免 start.sh:238 的 :-dev 回落让生产实例跑成 dev（本地存储 / Swagger / debug 日志）。
            export SPRING_PROFILE="${SPRING_PROFILE:-prod}"
            cd /usr/local/server/java/firestar
            case "$ACTION" in
              stop)    bash bin/stop.sh ;;
              start)   bash bin/start.sh "$PORT" "$HEALTH_PATH" ;;
              restart) bash bin/stop.sh && bash bin/start.sh "$PORT" "$HEALTH_PATH" ;;
            esac