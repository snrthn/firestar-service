name: firestar-service
sources:
  my_repo:
    type: codeup
    name: firestar-service
    endpoint: https://codeup.aliyun.com/6923140d3b25a962b43a7ff4/firestar-service.git
    branch: main
    triggerEvents:
      - push
    branchesFilter: ^main$
    certificate:
      type: serviceConnection
      serviceConnection: bii4ow7cqitmb438

stages:
  build_stage:
    name: 测试与构建
    jobs:
      test_job:
        name: 代码扫描与单元测试
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        condition: |
          "${ACTION}" == "deploy"
        steps:
          setup_java_step:
            step: SetupJava
            name: 安装 JDK17 + Maven
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
          p3c_step:
            step: JavaP3CScan
            name: Java 代码规约扫描
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
              incrementalScan: true
          unit_test_step:
            step: Command
            name: Maven 单元测试
            with:
              run: |
                set -e
                # =====================================================================
                # CI 门禁：云效 alinux3 构建容器无 MySQL 实例，这里只跑纯单测
                # =====================================================================
                # 集成测试已迁到 it profile + firestar_test 独立库（不碰 dev 库，
                # schema 由 Flyway 从空库全量重放自建），在带 MySQL 的本地或
                # 自建 CI 环境执行：bash scripts/run-integration-tests.sh
                # 下列集成测试类仍需 MySQL，故不在本 job 运行：
                #   - ApiDocsClosedTest: 需要 Spring 上下文 + 数据库
                #   - DatabaseCheckEndpointTest: 需要数据库
                #   - DatabaseCheckServiceTest: 需要数据库
                #   - EntityMappingConsistencyTest: 需要数据库
                #   - MybatisPlusSmokeTest: 需要数据库
                #   - SecurityExposureTest: 需要 Spring 上下文
                #
                # 保留的测试类（纯单元测试，不需要数据库）：
                #   - SmokeTest: 纯单元测试
                #   - AuthControllerStreamTest: Mock 测试
                #   - AuditDictConsistencyTest: 静态扫描 @Auditable 注解 ↔ sys_dict_data
                #     字典的双向差集（枚举漏补字典就 fail），不连库、不需要 MySQL。
                #     见 firestar-core/src/test/java/com/firestar/seed/
                # ⚠️ 多模块 reactor（core / biz / server）：-Dtest 会作用到每个模块，
                #    SmokeTest / AuthControllerStreamTest 只在 firestar-server，
                #    core / biz 零匹配会被 surefire 3.2.5 直接判失败，必须带
                #    -Dsurefire.failIfNoSpecifiedTests=false（bin/test.sh 里同款兜底）。
                # =====================================================================
                echo "[info] Running unit tests only (excluding integration tests that require MySQL)..."
                mvn -B test \
                  -Dtest='SmokeTest,AuthControllerStreamTest,AuditDictConsistencyTest,GlobalExceptionHandlerTest' \
                  -Dsurefire.failIfNoSpecifiedTests=false \
                  -Dmaven.test.failure.ignore=false
      build_job:
        name: Java 构建
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        needs:
          - test_job
        condition: |
          "${ACTION}" == "deploy"
        steps:
          setup_java_step:
            step: SetupJava
            name: 安装 JDK17 + Maven
            with:
              jdkVersion: '17'
              mavenVersion: '3.9.3'
          build_step:
            step: Command
            name: Java 构建并打包
            with:
              run: |
                mvn -B clean package -DskipTests
                rm -rf staging && mkdir -p staging
                cp firestar-server/target/firestar-server-*.jar staging/
                cp -r bin staging/bin
          upload_step:
            step: ArtifactUpload
            name: 构建物上传
            with:
              uploadType: packages
              serviceConnection: ystkn5uj361puwbk
              repo: flow_generic_repo
              artifact: default
              filePath:
                - staging/
              version: "${BUILD_NUMBER}"

  deploy_stage:
    name: 部署
    jobs:
      deploy_job:
        name: 主机组部署
        component: VMDeploy
        condition: |
          "${ACTION}" == "deploy"
        with:
          artifact: $[stages.build_stage.build_job.upload_step.artifacts.default]
          machineGroup: "qTjw4VWk6jWcfPpO"
          artifactDownloadPath: /home/admin/be-firestar/package.tgz
          executeUser: root
          run: |
            mkdir -p /usr/local/server/java/firestar
            tar zxvf /home/admin/be-firestar/package.tgz -C /usr/local/server/java/firestar --strip-components=1
            bash /usr/local/server/java/firestar/bin/deploy.sh

  ops_stage:
    name: 运维
    jobs:
      ops_job:
        name: 启停控制
        component: VMDeploy
        condition: |
          "${ACTION}" != "deploy"
        with:
          machineGroup: "qTjw4VWk6jWcfPpO"
          downloadArtifact: false
          executeUser: root
          run: |
            set -e
            ACTION="${ACTION:-restart}"
            PORT="${DEPLOY_PORT:-2025}"
            HEALTH_PATH="${HEALTH_PATH:-/actuator/health/liveness}"
            cd /usr/local/server/java/firestar
            case "$ACTION" in
              stop)    bash bin/stop.sh ;;
              start)   bash bin/start.sh "$PORT" "$HEALTH_PATH" ;;
              restart) bash bin/stop.sh && bash bin/start.sh "$PORT" "$HEALTH_PATH" ;;
            esac