# ============================================================
# firestar SSE 实时推送 —— nginx location 片段（部署时合入站点配置）
#
# 背景：后端 /auth/stream 是 SSE 长连接（SseEmitter，服务端 25s 发一次
# 心跳注释帧保活）。nginx 默认行为会把 SSE 毁掉：
#   1. proxy_buffering on  → 响应被缓冲，事件攒成"几秒一批"甚至全憋在连接关闭才吐
#   2. gzip on             → 流式响应被压缩缓冲，同样破坏实时性
#   3. proxy_read_timeout 60s → 超过 60s 无数据即断（服务端心跳 25s，本应够；
#                              但网络抖动/时钟偏差仍可能踩边界，这里显式放大到 1h）
#
# 用法：把下面 location 合进现有 server 块的对应位置（与 /api/ 代理同域），
# 或直接把整个文件 include 进 server 块。X-Accel-Buffering: no 是双保险——
# 即使某些中间层（CDN/上层代理）开了缓冲，应用层也能要求关。
# ============================================================

location /auth/stream {
    proxy_pass http://127.0.0.1:2025;   # 按实际后端 upstream 改

    # --- SSE 必须关掉的三样 ---
    proxy_buffering off;
    gzip off;
    proxy_cache off;

    # --- 超时对齐：服务端 SSE_TIMEOUT=1h、心跳 25s ---
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # --- 透传真实 IP（last_login_ip 审计依赖 XFF/X-Real-IP，见 IpUtil）---
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    # --- 双保险：显式告知上层不要缓冲 ---
    add_header X-Accel-Buffering no;
}

# 注意：/api/auth/stream 若走了统一的 /api/ location 前缀代理，
# 请确认该 location 内同样满足 proxy_buffering off + gzip off，
# 否则上面的 location 不生效（nginx 按最长前缀匹配）。
