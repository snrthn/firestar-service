# ============================================================
# firestar —— nginx 长连接（SSE / WebSocket）location 片段
#
# 【2026-10-19 修订】前缀从 /sse/、/socket/ 收敛为 /api/sse/、/api/socket/
#   —— 设计原则调整：所有后端调用统一走 /api 前缀（前端 vite 的 /api 规则会剥前缀），
#      SSE / WebSocket 不再作为例外裸奔，纳入同一体系。
#   剥前缀机制：location /api/sse/ 的 proxy_pass 写成 http://127.0.0.1:2025/sse/
#   （带尾 URI），nginx 自动把匹配的 /api/sse/ 替换为 /sse/，
#   于是 /api/sse/realtime => 后端 /sse/realtime。后端 SseController 一行不用动。
#   旧写法：location /sse/ { proxy_pass ...:2025; }        ← 裸前缀，例外处理
#   新写法：location /api/sse/ { proxy_pass ...:2025/sse/; } ← 与 /api 体系统一
#           location /api/socket/ { proxy_pass ...:2025/socket/; }
#
# 为什么必须改（不是优雅问题，是会出事）：
#   SSE 三关 proxy_buffering off / gzip off / proxy_cache off 里任漏一项，
#   nginx 不报错，只让流静默退化 —— 事件被攒成几秒一批、或憋到连接关闭才吐，
#   前端表现为「实时推送时好时坏」，排查成本极高。
#   配置重复 8 行 × N 条流 => 漏配概率随模块数线性上升。
#
# 【已落地】ECS 39.99.242.26 root@firestar，2026-10-19 应用并通过 nginx -t + reload
#   备份：/etc/nginx/nginx.conf.bak_<时间戳>
#   验收：见 docs/基础模块-通知帮助协议-调研结论.md 第十一章
# ============================================================


# ------------------------------------------------------------
# 一、http 级（放进 http { } 里，整个 nginx 只有一份，所有 server 块复用）
# ------------------------------------------------------------

# WebSocket 握手要按请求里的 Upgrade 头决定回 Connection: upgrade 还是 close。
# 惯用法：缺省 upgrade，Upgrade 头为空（普通 HTTP 请求）时给 close。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ------------------------------------------------------------
# 二、server 级（放进对应 server { } 里，必须写在 SPA 的 location / 之前靠
#     longest-prefix 自然命中；不要写成 ^~，原因见文末「坑 1」）
# ------------------------------------------------------------

# ---- SSE：服务端单向推送（SseEmitter / text-event-stream）----
# 覆盖：/api/sse/realtime（主通道）、将来的 /api/sse/xxx 全部自动继承本配置。
# proxy_pass 带尾 URI /sse/：把 /api/sse/ 前缀剥掉再转后端，与全站 /api 体系对齐。
location /api/sse/ {
    proxy_pass http://127.0.0.1:2025/sse/;      # 后端端口 + 剥 /api 的尾 URI，按实际改

    proxy_http_version 1.1;                    # 长连接必须有
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- SSE 必须关掉的三样（漏任一条即静默退化）---
    proxy_buffering off;                       # 别缓冲，否则事件攒批
    proxy_cache off;
    gzip off;                                  # 压缩会引入自己的缓冲

    # --- 超时对齐：后端 SseRealtimeGateway.SSE_TIMEOUT_MS=1h、心跳 25s ---
    proxy_connect_timeout 60s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # --- 双保险：即使上层还有 CDN/代理开了缓冲，应用层也能要求关 ---
    add_header X-Accel-Buffering no always;
}

# ---- WebSocket：双向隧道（Upgrade）----
# 本次是为「后期有需要」提前把通路铺好，后端尚无 WS 端点。
# proxy_pass 带尾 URI /socket/：同样剥 /api，与全站 /api 体系对齐。
location /api/socket/ {
    proxy_pass http://127.0.0.1:2025/socket/;

    proxy_http_version 1.1;                    # WS 强制要求 HTTP/1.1
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 1h;                     # WS 同理，别用默认 60s
    proxy_send_timeout 1h;
}


# ============================================================
# 坑（改之前先读，否则下次一定踩）
# ============================================================
#
# 坑 1：绝不能写成 location ^~ /api/sse
#   ^~ 会短路该前缀下的「所有后续匹配」，包括 error_page / try_files 的内部跳转。
#   本站点 SPA 依赖 try_files ... /index.html 兜底路由，写成 ^~ 后
#   /api/sse/foo 拿到非 2xx 时不会回落 index.html，直接 404。
#   用普通前缀 location /api/sse/，靠 longest-prefix 规则在 location / 之前命中即可。
#
# 坑 2：本片段的 proxy_pass 故意带尾 URI（/sse/、/socket/）
#   这是为了把前端统一加的 /api 前缀剥掉：location /api/sse/ + proxy_pass .../sse/
#   => /api/sse/realtime 转发到后端 /sse/realtime。后端路由本身不带 /api
#   （全站靠前端 vite 的 /api 规则剥离），所以这里「带尾 URI」是正确的、有意的。
#   反例：若写成 proxy_pass http://127.0.0.1:2025;（无尾 URI），则 /api/sse/realtime
#   原样转发成后端 /api/sse/realtime，而后端无此路由 => 404（不报错，难查）。
#   注意：其它普通 /api 业务走的是「不带尾 URI + vite/后端自己剥」的另一套，别混。
#
# 坑 3：不要「一个 topic 一条连接」
#   /api/sse/notify、/api/sse/approval 各开一条 => 用户开 5 个 Tab × 3 topic = 15 条并发
#   长连接，HTTP/1.1 同域上限 6 条，其余全阻塞，页面其他请求排队。
#   正确做法：只有一条 /api/sse/realtime，消息体里带 topic 字段由前端分发。
#   nginx 侧永远只有这一条 location，扩展的是订阅回调，不是连接数。
#
# 坑 4：每个 server 块要单独加
#   本片段是 per-server 的（map 才是 http 级、全局一份）。站点若后面补 HTTPS
#   （star.snrthn.com 目前是纯 HTTP，无 443），新 server 块要把上面两个 location
#   原样复制一份 —— 这也是本次「先把通路铺好」的价值：将来只复制，不再重新调参。
# ============================================================
