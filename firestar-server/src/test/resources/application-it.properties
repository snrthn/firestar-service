# ============================================================
# 集成测试专用 profile: it (integration test)
#
# 只在 test classpath 可见，不会打进生产 jar。刻意不叫 "test"：
#   main/resources/application-test.properties 是**真实 test 环境部署**用的，
#   带 OSS 凭据等必填注入项；同名文件在 classpath 上会相互覆盖，语义混淆。
#   it 与 dev / test / pre / prod 完全隔离。
#
# 设计目标（方案 B）：
#   1. 彻底不碰 dev 库 firestar —— 只连 firestar_test。
#   2. 自带 schema + 种子 —— 空库由 Flyway 全量重放 V1~V108 + V200 自建。
#   3. 干净 shell 也能跑 —— 不依赖 OSS / JWT / AI 密钥的外部注入。
# ============================================================

# 数据库：只认 IT_DB_URL（集成测试专用变量），与部署用 DB_URL 彻底解耦。
#   历史坑：曾用 ${DB_URL:...}，而 .env/dev.env / 云效变量区的 DB_URL 指向 dev
#   库 firestar（生产环境指向生产库），会直接劫持 JDBC，把 Flyway 全量迁移和
#   测试数据打到非测试库上。改专用变量名后，外部注入的 DB_URL 一律无效。
#   缺省回退到自包含的 firestar_test 默认连接，干净 shell / IDE 直接 Run 也可跑。
#   scripts/run-integration-tests.sh 会显式注入 IT_DB_URL 并做库名断言。
spring.datasource.url=${IT_DB_URL:jdbc:mysql://127.0.0.1:3306/firestar_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Flyway：空库全量重放，schema + 种子唯一来源 ----
# 建表职责归 Flyway（含 V3 的 62 张 Flowable 引擎表），引擎不自建。
# 第三个 location 是测试专用补偿迁移（V26.1 / V27.1 / V74.1）：
#   历史脚本 V27/V28/V75 的 information_schema 守卫把库名写死成 'firestar'，
#   在 firestar_test 里重放会误判并跳过 DDL。已应用迁移不能改（checksum 铁律），
#   故用小数版本号迁移在对应脚本之前补齐。该目录只在 test classpath，不进 jar，
#   dev / pre / prod / test 四个部署 profile 均不加载。
flowable.database-schema-update=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/biz,classpath:db/migration/it

# ---- 测试专用固定值 ----
# 仅本文件可见、不进 jar，不影响生产 JWT_SECRET / AI_KEK「缺失即失败」纪律。
# 固定值让干净 shell、CI、IDE 里直接 Run Test 都不需要额外配环境变量。
jwt.secret=FIRESTAR_IT_ONLY_SECRET_NOT_FOR_ANY_DEPLOYED_ENV_2026
ai.kek=FIRESTAR_IT_ONLY_KEK_NOT_FOR_ANY_DEPLOYED_ENV_2026
# 出域脱敏规则与部署 profile 一致（固定值同 dev）：strict=严格；relaxed=宽松；log-only=放行记录
ai.egress.mode=strict
ai.egress.rules[0].field=taxNo
ai.egress.rules[0].action=PSEUDONYMIZE
ai.egress.rules[1].field=bankAccount
ai.egress.rules[1].action=PARTIAL_MASK
ai.egress.rules[2].field=idCard
ai.egress.rules[2].action=REDACT
ai.egress.rules[3].field=customerName
ai.egress.rules[3].action=PSEUDONYMIZE
ai.egress.rules[4].field=amount
ai.egress.rules[4].action=PASS
ai.coze.plugin-secret=FIRESTAR_IT_ONLY_COZE_PLUGIN_SECRET_2026

# 文件存储：本地临时目录，绕开 OSS 账号（STORAGE_TYPE 缺省即 local）
firestar.storage.type=${STORAGE_TYPE:local}
firestar.storage.local.dir=${IT_STORAGE_DIR:./target/it-uploads}

# ---- 接口文档保持关闭（与生产默认一致，SecurityExposureTest 依赖此行为）----
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- 日志：集成测试降噪 ----
logging.level.root=warn
logging.level.com.firestar=info
logging.level.org.flowable=warn

# ---- 登录爆破防护：降低阈值，便于集成测试快速验证（it profile 专属，不进 jar）----
security.login.max-retry-count=3
security.login.lock-seconds=900
security.login.ip-limit-count=5
security.login.ip-limit-window-seconds=60
security.login.alert-enabled=true
