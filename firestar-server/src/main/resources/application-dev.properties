# ============================================================
# 开发环境 (dev) — 本地 MySQL (firestar) + debug 日志
# 连接信息见 .env/dev.env（该目录不入库，模板 .env/example.env）
# 密码不落库：由 bin/start.sh 自动 source .env/dev.env 注入
# ============================================================
# ⚠️ host/port 支持环境变量注入（DB_HOST/DB_PORT），默认 127.0.0.1:3306 不影响本地开发。
#    用途：云效 CI 用 docker sidecar 起 MySQL 时，通过 export DB_HOST 指向该容器
#    （详见 docs/云效率流水线配置.yaml 的 unit_test_step）；本地无 DB_HOST 时回落到 127.0.0.1。
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/firestar?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis（技术栈要求，按需启用）
# spring.data.redis.host=127.0.0.1
# spring.data.redis.port=6379

# Flowable：建表职责已交给 Flyway（V3__flowable_schema.sql）
# 原为 true —— 引擎启动时自己建ACT_*/FLW_* 表。
# 为什么改成 false：
#   ① 保持 dev / prod 同步。prod 一直是 false（生产不能静默改表），
#      dev 若仍为 true，则dev 与 prod 的建表来源不同 → 跨环境行为分叉。
#   ② 引擎自建不留迁移历史，出问题无法审计「这张表何时建的」。
#   ③ 迁移历史唯一来源 = Flyway。V3 的 DDL 逐字提取自官方 7.1.0 jar，
#      与引擎自建结果已交叉验证一致（62 张表 / 835 列 / schema.version 7.1.0.2）。
# 改此配置前必须先删掉 dev 库里的引擎表，否则 Flyway V3 会撞 "table already exists"。
flowable.database-schema-update=false
# Flyway：开发期也走迁移脚本，保证与 prod 的迁移历史一致
# （原为 false —— 会导致 dev 手工灌的表没有版本记录，切prod 时 Flyway 校验直接失败）
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/biz

logging.level.root=info
logging.level.com.firestar=debug
logging.level.org.flowable=warn

# ---- JWT 密钥：仅本地开发用的回退值 ----
# 基础配置里 jwt.secret=${JWT_SECRET}（缺了就启动失败）。本地开发为了「clone 下来就能跑」，
# 这里给一个 **只在 dev profile 生效** 的固定值；test / pre / prod 三个 profile 都不覆盖它，
# 因此仍然严格要求外部注入 JWT_SECRET —— 别把这段复制到其它 profile 里。
# （dev 密钥泄露无实际价值：dev 库只有本地种子数据，且该值不会被任何共享环境采用。）
jwt.secret=${JWT_SECRET:FIRESTAR_DEV_ONLY_SECRET_DO_NOT_USE_OUTSIDE_LOCAL_DEV_2026}

# ---- 接口文档：开发环境打开（便于调试），其它环境在基础配置里默认关闭 ----
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---- 文件存储：dev 走本地磁盘，不依赖云账号 ----
# 注意本地存储是单机的，多实例不共享，故 test/pre/prod 一律走 OSS。
firestar.storage.type=local
firestar.storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}

# ============================================================
# AI 助手（阶段一 L0+L1，设计见 docs/AI助手集成设计.md）
# - 生效供应商以 DB【模型配置】sys_model_config.is_active=1 行为唯一真源，运行期可在页面切换，无需重启。
# - KEK（密钥加密密钥）由环境变量 AI_KEK 注入，缺失即启动失败
#   （沿用 jwt.secret 的「宁可起不来也不带病上线」纪律；BC 加密只认这个 KEK）。
# - 密钥本身（bot_id / api_key）入库加密，运行期由【模型配置】页维护，不进 git。
# - 出域脱敏：strict=严格脱敏；relaxed=宽松；log-only=放行但记录敏感字段出域（灰度用）。
# ============================================================
ai.kek=${AI_KEK}
ai.egress.mode=strict
ai.egress.rules[0].field=taxNo
ai.egress.rules[0].action=PSEUDONYMIZE
ai.egress.rules[1].field=bankAccount
ai.egress.rules[1].action=PARTIAL_MASK
ai.egress.rules[2].field=idCard
ai.egress.rules[2].action=REDACT
ai.egress.rules[3].field=customerName
ai.egress.rules[3].action=PSEUDONYMIZE
ai.egress.rules[4].field=amount
ai.egress.rules[4].action=PASS

# 出网方式（代理 / 直连）由运行环境决定，应用不内置代理逻辑。

# Coze 插件回调 HMAC 校验密钥（与 Coze 平台「自定义插件」配置的公钥一致），环境变量注入。
ai.coze.plugin-secret=${COZE_PLUGIN_SECRET}
