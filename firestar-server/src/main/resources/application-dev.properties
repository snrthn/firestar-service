# ============================================================
# 开发环境 (dev) — 本地 MySQL (firestar) + debug 日志
# 连接信息见 .env/dev.env（该目录不入库，模板见 .env/example.env）
# 密码不落库：由 bin/start.sh 自动 source .env/dev.env 注入
#
# 【2026-11-24】IDE / mvn 直接跑主类不经 start.sh，凭据不会注入 → ${DB_URL} 占位符残留导致启动失败。
#   这里用 spring.config.import 让 Spring 自己读取 dev.env（[.properties] 后缀强制按 properties 解析，
#   否则 .env 扩展名不被识别）。两种启动方式都能拿到凭据：
#     · bin/start.sh：先 load_env 注入环境变量（优先级更高，仍覆盖文件值）→ 行为不变
#     · IDE / mvn spring-boot:run：无环境变量 → 从本行导入 dev.env → 补齐凭据
#   optional: 前缀保证 dev.env 缺失时不阻塞启动（改由环境变量/云效注入，如 CI 的 test/prod）。
#   仅 dev profile 加此行；test/pre/prod 不导入，避免与云效私密变量/部署注入打架。
# ============================================================
spring.config.import=optional:file:.env/dev.env[.properties]
# 数据库：完整 JDBC URL 由环境变量 DB_URL 注入（见 .env/dev.env）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flowable：建表职责已交给 Flyway（V3__flowable_schema.sql），引擎不再自动改表
flowable.database-schema-update=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/biz

logging.level.root=info
logging.level.com.firestar=debug
logging.level.org.flowable=warn

# JWT 密钥：仅本地开发回退值（缺 JWT_SECRET 时生效）；其它 profile 严格要求外部注入，勿复制此段
jwt.secret=${JWT_SECRET:FIRESTAR_DEV_ONLY_SECRET_DO_NOT_USE_OUTSIDE_LOCAL_DEV_2026}

# 接口文档：开发环境打开便于调试，其它环境在基础配置默认关闭
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 文件存储：dev 走本地磁盘，不依赖云账号（多实例不共享，故 test/pre/prod 一律走 OSS）
firestar.storage.type=${STORAGE_TYPE:local}
firestar.storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}

# ============================================================
# AI 助手（阶段一 L0+L1）
# - 生效供应商以 DB【模型配置】sys_model_config.is_active=1 行为唯一真源，运行期可在页面切换
# - KEK（密钥加密密钥）由环境变量 AI_KEK 注入，缺失即启动失败
# - 密钥本身（bot_id / api_key）入库加密，运行期由【模型配置】页维护，不进 git
# - 出域脱敏：strict=严格脱敏；relaxed=宽松；log-only=放行但记录敏感字段出域（灰度用）
# ============================================================
ai.kek=${AI_KEK}
ai.egress.mode=strict
ai.egress.rules[0].field=taxNo
ai.egress.rules[0].action=PSEUDONYMIZE
ai.egress.rules[1].field=bankAccount
ai.egress.rules[1].action=PARTIAL_MASK
ai.egress.rules[2].field=idCard
ai.egress.rules[2].action=REDACT
ai.egress.rules[3].field=customerName
ai.egress.rules[3].action=PSEUDONYMIZE
ai.egress.rules[4].field=amount
ai.egress.rules[4].action=PASS
ai.egress.rules[5].field=phone
ai.egress.rules[5].action=PARTIAL_MASK
ai.egress.rules[6].field=email
ai.egress.rules[6].action=PARTIAL_MASK
ai.egress.rules[7].field=ip
ai.egress.rules[7].action=PARTIAL_MASK
ai.egress.rules[8].field=ipAddress
ai.egress.rules[8].action=PARTIAL_MASK

# ---- 2026-11-25 出域收口：补齐真实 VO 字段名（原规则名 taxNo/bankAccount 与 VO 的 customerTaxNo 等漂移，导致脱敏静默失效）----
ai.egress.rules[9].field=customerTaxNo
ai.egress.rules[9].action=PSEUDONYMIZE
ai.egress.rules[10].field=customerBankAccount
ai.egress.rules[10].action=PARTIAL_MASK
ai.egress.rules[11].field=customerBuyerPhone
ai.egress.rules[11].action=PARTIAL_MASK
ai.egress.rules[12].field=buyerTaxNo
ai.egress.rules[12].action=PSEUDONYMIZE
ai.egress.rules[13].field=buyerBankAccount
ai.egress.rules[13].action=PARTIAL_MASK
ai.egress.rules[14].field=buyerPhone
ai.egress.rules[14].action=PARTIAL_MASK
ai.egress.rules[15].field=contactPhone
ai.egress.rules[15].action=PARTIAL_MASK
ai.egress.rules[16].field=downloadIp
ai.egress.rules[16].action=PARTIAL_MASK

# Coze 插件回调 HMAC 校验密钥（环境变量注入，须与 Coze 平台「自定义插件」公钥一致）
ai.coze.plugin-secret=${COZE_PLUGIN_SECRET}
