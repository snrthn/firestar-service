# ============================================================
# 基础配置（所有 profile 共享）
# 端口 2025（与前端 dev 代理、CI/bin 脚本一致）
# ============================================================
server.port=2025
spring.application.name=firestar-service
# ---- 激活哪个 profile：优先看环境变量 SPRING_PROFILES_ACTIVE，没有才回退 dev
#
# 【为什么不能硬编码 dev —— 这是真出过事的】
# 之前写死 spring.profiles.active=dev，流水线虽然正确注入了 DB_URL 等
# Secrets，但 profile 仍是 dev。dev 的 datasource.url 是**硬编码的**
# （application-dev.properties 里写死 jdbc:mysql://127.0.0.1:3306/firestar），
# 一旦某个环境忘了注入 DB_URL，应用就会用开发配置连库，
# 在生产上连的是 127.0.0.1 —— 而生产 DB 恰好也在 127.0.0.1，
# **连得上、但用的是开发账号**，故障会表现为"数据莫名其妙不对"，
# 比连不上更难查。默认改成 prod：宁可在开发机上忘了设环境变量直接起不来，
# 也不要静默地用错配置连上生产库。
#
# 本地开发请显式指定：mvn spring-boot:run -Dspring-boot.run.profiles=dev
# 或 export SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ---- Actuator 健康检查（CI / bin 脚本轮询 /actuator/health）----
management.endpoints.web.exposure.include=health,info
# ⚠️ 全局保持 never：details 含库名/表名，属运维信息，不该对外部暴露。
# 需要看细节时用两个途径：
#   1. 本地/内网 → 访问 /api/system/db-check（独立端点，不受此开关影响）
#   2. 临时排查 → 启动加 --management.endpoint.health.show-details=always
# 自定义的 DatabaseTableHealthIndicator 已把「表数/种子数据是否符合基线」并入 UP/DOWN，
# 所以即使看不到 details，CI 靠 status 也能发现初始化漏跑。
management.endpoint.health.show-details=never

# ---- 部署就绪探针（liveness）：只验进程存活 + 磁盘，绝不碰数据库 / 数据完整性 ----
# 用途：bin/start.sh / bin/deploy.sh 的启动门禁用 /actuator/health/liveness，
#       避免「自定义 DatabaseTableHealthIndicator 的表数/种子数基线与生产库不一致」
#       或「库慢/网络抖」被误判成「启动超时」（详见 bin/start.sh 注释）。
# 完整健康（含库连通、数据基线）有两条获取途径，都不依赖匿名 HTTP：
#   1. 启动时自动写日志 —— StartupHealthReporter 把聚合状态 + 逐组件状态打成
#      `[startup-health] status=... components=[...]`，bin/start.sh 就绪后直接读它；
#   2. 登录后访问 /system/db-check（需 JWT），拿到完整自检报告。
# ⚠️ 不要再让脚本匿名 curl /actuator/health：它现在要认证（401），
#    把 401 当「跳过检查」等于丢掉了启动时确认库连通的能力。
# ⚠️ 不要把 databaseTableHealthIndicator 放进 liveness（默认它就不在该组，勿手滑加进去）。
management.endpoint.health.group.liveness.include=ping,diskSpace

# ---- 接口文档（springdoc / Swagger UI）----
# 🔴 默认 **关闭**（fail-closed）：没显式打开的环境都拿不到 /v3/api-docs、/doc.html。
#   只有 dev profile 显式打开；test / pre / prod 一律保持关闭 —— 接口清单本身就是攻击地图
#   （能直接看出来所有管理端路径、参数名、是否需要鉴权），不该对公网可见。
#   若某个测试环境确实需要 Swagger，请在对应 profile 里显式打开，并在 nginx 层加 IP 白名单。
#   SecurityConfig 读同一个开关决定是否把文档路径放进匿名白名单 ——
#   关掉 springdoc 的同时，白名单里也自动没有这几条路径，不存在「代码关了、配置还放行」的错位。
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- MyBatis-Plus ----
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.firestar.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键策略：AUTO = 交给数据库自增（V1 全部表 id BIGINT AUTO_INCREMENT）
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除全局口径。未声明 is_deleted 的实体（三层 RBAC / 审计日志等）不受影响，
# 因为该配置只对"实体中存在该属性"的表生效；实体上仍显式标注 @TableLogic 以便阅读。
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 更新时忽略 null 字段（部分更新语义，配合乐观锁使用）
mybatis-plus.global-config.db-config.update-strategy=not_null

# ---- 多租户（技术栈文档：云端多租户 SaaS）----
# V1 全部表 tenant_id 默认 0（单租户期），TenantLineInnerInterceptor 已在
# MybatisPlusConfig 中预留位置但**未启用**。启用条件：租户上下文解析完成
# 且所有业务查询显式支持按租户过滤。

# ---- JWT（认证模块）----
# 🔴 密钥只能由环境变量 JWT_SECRET 注入，**任何 profile 都不许在这里写死**。
#   来源：云效「主机部署」私密变量 / K8s Secret / 本地 .env/<profile>.env（start.sh 会 source）。
#   要求：≥32 字节的强随机值（HS256 最小长度），例如 `openssl rand -base64 48`。
#   缺失的处理：启动直接失败（JwtProperties 启动即校验），不允许静默回退到默认值。
#   【为什么必须 fail-fast，而不是给个默认值】历史上这里就是
#   `jwt.secret=FIRESTAR_DEV_SECRET_CHANGE_ME_...` 的硬编码占位，且随代码进了版本库：
#   1) 生产/预发/测试 profile 都没覆盖它 → 线上实际用的就是这个公开字符串，
#      任何拿到仓库的人都能离线签出「admin + ROLE_ADMIN」的 token，等同绕过登录；
#   2) 换成 `${JWT_SECRET:某个默认值}` 同样危险 —— 忘配环境变量时应用照样起得来，
#      没人会发现线上密钥是公开的。宁可在部署时报错，也不能静默带病上线。
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000
jwt.issuer=firestar

# ---- 文件存储（文件管理模块）----
# 默认 local：本地开发不依赖云账号；test/pre/prod 在各自 profile 覆盖为 oss。
# 切换只改这一项，业务代码无感（FileStorageService 接口抽象）。
firestar.storage.type=${STORAGE_TYPE:local}
firestar.storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}

# ---- 上传大小限制（纪律红线 4：上传要校验格式和大小，防恶意文件）----
# 财务系统的银行回单 / 发票 PDF 通常 < 10MB，20MB 单文件上限留足余量。
# 超过阈值由 Spring 直接拒，不会走到业务代码。
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# ---- 日志落盘 + 滚动（R1 修复：防止单文件无限增长）----
# 所有 profile 统一写 logs/app.log，由 logback 按大小滚动 + 总容量封顶。
# bin/start.sh 的 stdout 重定向已改为 /dev/null（避免与 logback 双写）；
# 启动自检结论 [startup-health] 由本配置驱动 logback 写入 app.log，脚本健康检查照常命中。
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=15
logging.logback.rollingpolicy.total-size-cap=300MB

# ---- Flowable 引擎裁剪（R2 修复：关掉与审批无关的引擎，仅保留 BPMN）----
# 属性名从 flowable-spring-boot-autoconfigure-7.1.0.jar 的 spring-configuration-metadata.json 核实：
# 只有 app/cmmn/dmn/eventregistry/idm 五个引擎有 .enabled 开关，process 是核心引擎无开关。
flowable.cmmn.enabled=false
flowable.dmn.enabled=false
flowable.eventregistry.enabled=false
flowable.idm.enabled=false
flowable.app.enabled=false

# ---- 登录爆破防护（L1 账户锁定 + L2 IP 限流）----
# firestar 当前未接入 Redis，全部状态落 MySQL（见 V202 迁移）。
# 阈值可按环境调整；it 集成测试 profile 用更低阈值便于快速验证。
security.login.max-retry-count=5
security.login.lock-seconds=900
security.login.ip-limit-count=20
security.login.ip-limit-window-seconds=60
security.login.alert-enabled=true
