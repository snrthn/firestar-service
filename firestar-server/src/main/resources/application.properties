# ============================================================
# 基础配置（所有 profile 共享）
# 端口 2025（与前端 dev 代理、CI / bin 脚本一致）
# ============================================================
server.port=2025
spring.application.name=firestar-service

# 激活 profile：优先取环境变量 SPRING_PROFILES_ACTIVE，缺省回退 dev。
# 本地一律走 dev：IDE / mvn spring-boot:run / bin/start.sh 未显式指定时均为 dev。
# 线上所有路径（云效 deploy.sh / ops_stage / systemd 开机点火）都由命令行
#   --spring.profiles.active=prod 覆盖；命令行参数优先级高于本处默认值。
# 严禁在线上用「裸 java -jar」启动：没有命令行覆盖时会静默回落到 dev。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator 健康检查（CI / bin 脚本轮询 /actuator/health）
management.endpoints.web.exposure.include=health,info
# 不暴露 details：details 含库名/表名，属运维信息，不对外部暴露
management.endpoint.health.show-details=never

# 部署就绪探针（liveness）：只验进程存活 + 磁盘，不碰数据库 / 数据完整性
# 完整健康（含库连通、数据基线）由启动自检日志与 /api/system/db-check 提供
management.endpoint.health.group.liveness.include=ping,diskSpace

# 接口文档（springdoc / Swagger UI）：默认关闭（fail-closed），避免接口清单对公网暴露
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.firestar.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键策略：AUTO = 交给数据库自增（V1 全部表 id BIGINT AUTO_INCREMENT）
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除全局口径（仅对声明了 isDeleted 的实体生效）
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 更新时忽略 null 字段（部分更新语义，配合乐观锁使用）
mybatis-plus.global-config.db-config.update-strategy=not_null

# 多租户：V1 全部表 tenant_id 默认 0（单租户期），TenantLineInnerInterceptor 已预留但未启用
# 启用条件：租户上下文解析完成且所有业务查询显式支持按租户过滤

# JWT：密钥只能由环境变量 JWT_SECRET 注入，任何 profile 都不许写死；缺失即启动失败
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000
jwt.issuer=firestar

# 文件存储：默认 local（本地开发不依赖云账号）；test/pre/prod 在各 profile 覆盖为 oss。
# 切换只改这一项，业务代码无感（FileStorageService 接口抽象）
firestar.storage.type=${STORAGE_TYPE:local}
firestar.storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}

# 上传大小限制：财务回单 / 发票 PDF 通常 < 10MB，20MB 单文件上限留足余量
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# 日志落盘 + 滚动：所有 profile 统一写 logs/app.log，按大小滚动 + 总容量封顶
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=15
logging.logback.rollingpolicy.total-size-cap=300MB

# Flowable 引擎裁剪：关闭与审批无关的引擎，仅保留 BPMN（process 为核心引擎无开关）
flowable.cmmn.enabled=false
flowable.dmn.enabled=false
flowable.eventregistry.enabled=false
flowable.idm.enabled=false
flowable.app.enabled=false

# 登录爆破防护（L1 账户锁定 + L2 IP 限流）：firestar 当前未接入 Redis，状态落 MySQL
security.login.max-retry-count=5
security.login.lock-seconds=900
security.login.ip-limit-count=20
security.login.ip-limit-window-seconds=60
security.login.alert-enabled=true
