# ============================================================
# 测试环境 (test) — url 写死，账号密码走注入（.env/test.env 或云效私密变量）
# ============================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/firestar_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

flowable.database-schema-update=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/biz

logging.level.root=info
logging.level.com.firestar=debug

# ---- 文件存储：OSS ----
# ⚠️ 与 pre 共用 fire-star-stage，靠 base-dir 前缀（test/ vs pre/）区分。
#    共用桶意味着两者是「软隔离」：清理任务务必按 bucket + 前缀双重限定范围。
# AK/SK 不落库，由 .env/test.env 或云效 Secrets 注入。
#
# ⚠️【endpoint 为什么用标准域名】2026-10-16 实测：oss.snrthn.com 绑定的
#    **fire-star-prod** 桶，而本 profile 用 fire-star-stage。OSS 签名把 Host
#    算进 StringToSign，用「绑了别的桶的域名」签本桶请求 → SignatureDoesNotMatch 403。
#    一个自定义域名只能绑一个桶，所以 stage 想用预览需要**再绑一个子域名**
#    （如 oss-stage.snrthn.com），跨桶复用同一个域名是不成立的。
#
# ⚠️【默认域名的代价：图片预览不可用】实测默认域名下 jpg 响应带
#    content-disposition: attachment（浏览器强制下载），且签名参数
#    response-content-disposition=inline **压不过它**；pdf 不受影响。
#    → 需要图片在线预览时，给本桶绑一个自定义域名 + 证书托管，
#      再把 OSS_PUBLIC_DOMAIN 填上（代码会自动切到该域名并开启 CNAME 支持）。
firestar.storage.type=oss
firestar.storage.oss.endpoint=${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
firestar.storage.oss.bucket=${OSS_BUCKET:fire-star-stage}
firestar.storage.oss.access-key-id=${OSS_ACCESS_KEY_ID}
firestar.storage.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET}
firestar.storage.oss.base-dir=test
firestar.storage.oss.public-domain=${OSS_PUBLIC_DOMAIN:}
firestar.storage.oss.sign-url-expire-minutes=10
