# ============================================================
# 生产环境 (prod) — 所有密钥必须从环境变量 / 配置中心注入
# 严禁在此文件写任何明文密码、AK/SK、token
# 真实值由 ${DB_URL} / ${DB_USERNAME} / ${DB_PASSWORD} 提供
#   - 来源：进程环境变量 / K8s Secret / 配置中心 / 云效 Secrets
# ============================================================
# ---- JWT：生产密钥只从环境变量注入，缺了就不许启动 ----
# 云效「主机部署」变量区必须先加 JWT_SECRET（≥32 字节强随机，例如 openssl rand -base64 48）。
# 换了密钥 = 所有已签发 token 立即失效（全端需重新登录），这是预期行为。
jwt.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 生产：Flyway 负责建表与迁移（含 V3 Flowable 引擎表）；Flowable 不再自动改表
flowable.database-schema-update=false
spring.flyway.enabled=true
# 与 dev/pre 对齐：显式声明迁移脚本位置与baseline 策略
# ⚠️ baseline-on-migrate 必须 false —— 若为 true 且库里已有表但无迁移历史，
#    Flyway 会把当前状态当作基线「标记为已迁移」，导致 V1/V2/V3 被静默跳过，
#    出现"迁移历史显示成功但表根本没建"的假绿。宁可启动失败也不能假绿。
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/biz

# 生产只输出 error，降低日志量与敏感信息泄露面
logging.level.root=error
logging.level.com.firestar=warn

# ---- 接口文档：生产显式关闭（基础配置已默认 false，这里写死一遍防止有人「临时打开调试」）----
# 打开后 /api/v3/api-docs 会把全部接口、参数、鉴权要求以 JSON 形式交给任何匿名访问者。
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 生产端口固定 2025（与 CI / bin 脚本一致）
server.port=2025

# ---- 文件存储：OSS（生产专用桶 fire-star-prod，与 stage 物理隔离）----
# AK/SK 严禁写入本文件，必须由云效 Secrets / 环境变量注入。
firestar.storage.type=oss
firestar.storage.oss.endpoint=${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
firestar.storage.oss.bucket=${OSS_BUCKET:fire-star-prod}
firestar.storage.oss.access-key-id=${OSS_ACCESS_KEY_ID}
firestar.storage.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET}
firestar.storage.oss.base-dir=prod
# ---- 自定义域名 oss.snrthn.com（已启用）----
# ✅ 域名绑定：CNAME = fire-star-prod.oss-cn-beijing.aliyuncs.com（绑的是本 profile 的桶）
# ✅ 证书托管：2026-10-16 复测通过 —— CN=oss.snrthn.com，
#    SAN=[oss.snrthn.com, www.oss.snrthn.com]，签发者 Encryption Everywhere DV TLS CA - G2，
#    有效期 2026-10-15 → 2027-04。HTTPS 严格校验握手 TLSv1.3 成功，真实 PUT/GET 均 200。
#
# 启用的收益：图片/PDF 可在线预览。实测默认域名下图片会被强制加
#    Content-Disposition: attachment（inline 签名参数压不过），自定义域名下该头消失。
#
# ⚠️ 续期提醒：证书 2027-04 到期，到期后 HTTPS 会直接失败（表现为首次上传抛 SSL 异常，
#    build() 阶段不发请求所以启动不报错，容易被误判成 AK/SK 问题）。到期前记得续。
# ⚠️ 值必须带 https://，不带协议时会继承 endpoint 的协议。
firestar.storage.oss.public-domain=${OSS_PUBLIC_DOMAIN:}
firestar.storage.oss.sign-url-expire-minutes=10
