# ============================================================
# 种子基线（DatabaseCheckService 期望值的镜像 + 迁移侧约定）
# ============================================================
# 【这份文件是什么】
#   DatabaseCheckService（/system/db-check、actuator databaseTable 指标、启动自检）
#   里的 EXPECTED_* 常量，本文件是它们的「迁移侧镜像」：基线数字只维护在本文件 +
#   Java 常量两处，由 DatabaseCheckSeedBaselineGuardTest 保证两者永远一致。
#
# 【为什么需要它 —— 一个反复复发的事故】
#   自检是按「行数」校验种子数据的：迁移往 sys_dict_type / sys_dict_data 加了行，
#   Java 常量没跟着改 → 自检报「条数应为 N，实际 N+1」→ /system/db-check 直接返回
#   **503 Service Unavailable** → 前端工作台显示「后端连接失败」、actuator 报 DOWN。
#   这个坑历史上复发过至少 6 次（V19/V20/V22/V32/V34+V35/V214），
#   而且报错文案指向「后端连接失败」，跟字典毫无关联，排查方向极易带偏。
#
# 【规矩 —— 新迁移怎么写】
#   凡是你动了下列这些表的行数（新增/删除字典项、字典类型、配置种子、角色，
#   或新建 fin_/sys_/ai_ 前缀的业务表），你的迁移脚本里**必须**带一行标记：
#
#     -- db-check-baseline: table=51, dictType=37, dictData=162, config=14, role=9, roleConflict=4
#
#   填的是**改完之后的累计总数**（不是增量），且必须与本文件、以及
#   DatabaseCheckService 的同名常量三者一致。三处必须同一个 PR 改完。
#
#   护栏（DatabaseCheckSeedBaselineGuardTest）会强制：
#     ① 本文件 ≡ Java 常量；
#     ② baselineVersion 之后任何动了上述表的迁移，必须带标记；
#     ③ 版本号最高的那个标记 ≡ 本文件。
#   漏改任何一处，构建期就 fail —— 不再等部署后才炸。
#
# 【本文件自身的合法性】
#   本文件不参与 Flyway 迁移（Flyway 只扫 .sql），改它不会动数据库；
#   但改了它就必须同步改 Java 常量，否则护栏 ① 立刻 fail。
# ============================================================

# 护栏的起点版本：从这个版本之后（含）的迁移才强制要求带标记。
# 之前的迁移是历史存量，无法追溯补标记，故以本文件当前版本为锚点。
baselineVersion=214

# 以下 6 项必须与 DatabaseCheckService 的同名常量逐一相等
#   table       ← EXPECTED_TABLE_COUNT       （fin_/sys_/ai_ 前缀的业务表总数）
#   dictType    ← EXPECTED_DICT_TYPE_COUNT   （sys_dict_type 行数）
#   dictData    ← EXPECTED_DICT_DATA_COUNT   （sys_dict_data 行数）
#   config      ← EXPECTED_CONFIG_COUNT      （sys_config 行数）
#   role        ← EXPECTED_ROLE_COUNT        （sys_role 行数）
#   roleConflict← EXPECTED_ROLE_CONFLICT_COUNT（sys_role_conflict 行数）
table=52
dictType=37
dictData=162
config=14
role=9
roleConflict=4
