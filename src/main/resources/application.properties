# ============================================================
# 基础配置（所有 profile 共享）
# 端口 2025（与前端 dev 代理、CI/bin 脚本一致）
# ============================================================
server.port=2025
spring.application.name=firestar-service
# ---- 激活哪个 profile：优先看环境变量 SPRING_PROFILES_ACTIVE，没有才回退 dev
#
# 【为什么不能硬编码 dev —— 这是真出过事的】
# 之前写死 spring.profiles.active=dev，流水线虽然正确注入了 DB_URL 等
# Secrets，但 profile 仍是 dev。dev 的 datasource.url 是**硬编码的**
# （application-dev.properties 里写死 jdbc:mysql://127.0.0.1:3306/firestar），
# 一旦某个环境忘了注入 DB_URL，应用就会用开发配置连库，
# 在生产上连的是 127.0.0.1 —— 而生产 DB 恰好也在 127.0.0.1，
# **连得上、但用的是开发账号**，故障会表现为"数据莫名其妙不对"，
# 比连不上更难查。默认改成 prod：宁可在开发机上忘了设环境变量直接起不来，
# 也不要静默地用错配置连上生产库。
#
# 本地开发请显式指定：mvn spring-boot:run -Dspring-boot.run.profiles=dev
# 或 export SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ---- Actuator 健康检查（CI / bin 脚本轮询 /actuator/health）----
management.endpoints.web.exposure.include=health,info
# ⚠️ 全局保持 never：details 含库名/表名，属运维信息，不该对外部暴露。
# 需要看细节时用两个途径：
#   1. 本地/内网 → 访问 /api/system/db-check（独立端点，不受此开关影响）
#   2. 临时排查 → 启动加 --management.endpoint.health.show-details=always
# 自定义的 DatabaseTableHealthIndicator 已把「表数/种子数据是否符合基线」并入 UP/DOWN，
# 所以即使看不到 details，CI 靠 status 也能发现初始化漏跑。
management.endpoint.health.show-details=never

# ---- 部署就绪探针（liveness）：只验进程存活 + 磁盘，绝不碰数据库 / 数据完整性 ----
# 用途：bin/start.sh / bin/deploy.sh 的启动门禁用 /actuator/health/liveness，
#       避免「自定义 DatabaseTableHealthIndicator 的表数/种子数基线与生产库不一致」
#       或「库慢/网络抖」被误判成「启动超时」（详见 bin/start.sh 注释）。
# 完整健康检查（含库连通、数据基线）仍走 /actuator/health，供监控/告警使用，不阻断部署。
# ⚠️ 不要把 databaseTableHealthIndicator 放进 liveness（默认它就不在该组，勿手滑加进去）。
management.endpoint.health.group.liveness.include=ping,diskSpace

# ---- MyBatis-Plus ----
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.firestar.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键策略：AUTO = 交给数据库自增（V1 全部表 id BIGINT AUTO_INCREMENT）
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除全局口径。未声明 is_deleted 的实体（三层 RBAC / 审计日志等）不受影响，
# 因为该配置只对"实体中存在该属性"的表生效；实体上仍显式标注 @TableLogic 以便阅读。
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 更新时忽略 null 字段（部分更新语义，配合乐观锁使用）
mybatis-plus.global-config.db-config.update-strategy=not_null

# ---- 多租户（技术栈文档：云端多租户 SaaS）----
# V1 全部表 tenant_id 默认 0（单租户期），TenantLineInnerInterceptor 已在
# MybatisPlusConfig 中预留位置但**未启用**。启用条件：租户上下文解析完成
# 且所有业务查询显式支持按租户过滤。

# ---- JWT（认证模块）----
# ⚠️ 上线前必须替换为强随机密钥（≥32 字节），此处仅为开发期占位。
jwt.secret=FIRESTAR_DEV_SECRET_CHANGE_ME_32BYTES_MIN_2026_10_12_XK9P
jwt.expiration=7200000
jwt.issuer=firestar
