# ============================================================
# 基础配置（所有 profile 共享）
# 端口 2025（与前端 dev 代理、CI/bin 脚本一致）
# ============================================================
server.port=2025
spring.application.name=firestar-service
spring.profiles.active=dev

# ---- Actuator 健康检查（CI / bin 脚本轮询 /actuator/health）----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

