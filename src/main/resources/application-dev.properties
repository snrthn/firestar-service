# ============================================================
# 开发环境 (dev) — 本地 MySQL (firestar) + debug 日志
# 连接信息见 .env/dev.env（该目录不入库，模板 .env/example.env）
# 密码不落库：由 bin/start.sh 自动 source .env/dev.env 注入
# ============================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/firestar?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis（技术栈要求，按需启用）
# spring.data.redis.host=127.0.0.1
# spring.data.redis.port=6379

# Flowable：建表职责已交给 Flyway（V3__flowable_schema.sql）
# 原为 true —— 引擎启动时自己建ACT_*/FLW_* 表。
# 为什么改成 false：
#   ① 保持 dev / prod 同步。prod 一直是 false（生产不能静默改表），
#      dev 若仍为 true，则dev 与 prod 的建表来源不同 → 跨环境行为分叉。
#   ② 引擎自建不留迁移历史，出问题无法审计「这张表何时建的」。
#   ③ 迁移历史唯一来源 = Flyway。V3 的 DDL 逐字提取自官方 7.1.0 jar，
#      与引擎自建结果已交叉验证一致（62 张表 / 835 列 / schema.version 7.1.0.2）。
# 改此配置前必须先删掉 dev 库里的引擎表，否则 Flyway V3 会撞 "table already exists"。
flowable.database-schema-update=false
# Flyway：开发期也走迁移脚本，保证与 prod 的迁移历史一致
# （原为 false —— 会导致 dev 手工灌的表没有版本记录，切prod 时 Flyway 校验直接失败）
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

logging.level.root=debug
logging.level.com.firestar=debug

# ---- 文件存储：dev 走本地磁盘，不依赖云账号 ----
# 注意本地存储是单机的，多实例不共享，故 test/pre/prod 一律走 OSS。
firestar.storage.type=local
firestar.storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}
