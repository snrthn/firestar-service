# ============================================================
# 预发环境 (pre) — url 写死，账号密码走注入（.env/pre.env 或云效私密变量）
# ============================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/firestar_pre?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

flowable.database-schema-update=false
spring.flyway.enabled=true
# 与 dev/prod 对齐：显式声明迁移脚本位置，别依赖默认值
# （默认值恰好也是 classpath:db/migration，但显式写出来才能一眼看出三套环境一致）
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

logging.level.root=info
logging.level.com.firestar=warn
