# ============================================================
# 预发环境 (pre) — url 写死，账号密码走注入（.env/pre.env 或云效私密变量）
# ============================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/firestar_pre?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

flowable.database-schema-update=false
spring.flyway.enabled=true
# 与 dev/prod 对齐：显式声明迁移脚本位置，别依赖默认值
# （默认值恰好也是 classpath:db/migration，但显式写出来才能一眼看出三套环境一致）
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

logging.level.root=info
logging.level.com.firestar=warn

# ---- 文件存储：OSS（与 test 共用 fire-star-stage，base-dir=pre 区分）----
# 预发贴近生产，但 Bucket 仍与生产隔离（fire-star-prod），避免误写/误删生产文件。
# endpoint 说明与 test 一致（oss.snrthn.com 绑的是 fire-star-prod，本 profile 用
# fire-star-stage，不能拿它签本桶的请求，否则 SignatureDoesNotMatch 403）。
# pre 与 test 共用 fire-star-stage —— 软隔离，清理任务务必按 bucket + base-dir 双重限定。
firestar.storage.type=oss
firestar.storage.oss.endpoint=${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
firestar.storage.oss.bucket=${OSS_BUCKET:fire-star-stage}
firestar.storage.oss.access-key-id=${OSS_ACCESS_KEY_ID}
firestar.storage.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET}
firestar.storage.oss.base-dir=pre
firestar.storage.oss.public-domain=${OSS_PUBLIC_DOMAIN:}
firestar.storage.oss.sign-url-expire-minutes=10
