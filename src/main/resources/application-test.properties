# ============================================================
# 测试环境 (test) — url 写死，账号密码走注入（.env/test.env 或云效私密变量）
# ============================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/firestar_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

flowable.database-schema-update=true
spring.flyway.enabled=false

logging.level.root=info
logging.level.com.firestar=debug
