# ============================================================
# 生产环境 (prod) — 所有密钥必须从环境变量 / 配置中心注入
# 严禁在此文件写任何明文密码、AK/SK、token
# 真实值由 ${DB_URL} / ${DB_USERNAME} / ${DB_PASSWORD} 提供
#   - 来源：进程环境变量 / K8s Secret / 配置中心 / 云效 Secrets
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 生产：Flyway 负责建表与迁移；Flowable 不再自动改表
flowable.database-schema-update=false
spring.flyway.enabled=true

# 生产只输出 error，降低日志量与敏感信息泄露面
logging.level.root=error
logging.level.com.firestar=warn

# 生产端口固定 2025（与 CI / bin 脚本一致）
server.port=2025
