# ============================================================
# 生产环境 (prod) — 所有密钥必须从环境变量 / 配置中心注入
# 严禁在此文件写任何明文密码、AK/SK、token
# 真实值由 ${DB_URL} / ${DB_USERNAME} / ${DB_PASSWORD} 提供
#   - 来源：进程环境变量 / K8s Secret / 配置中心 / 云效 Secrets
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 生产：Flyway 负责建表与迁移（含 V3 Flowable 引擎表）；Flowable 不再自动改表
flowable.database-schema-update=false
spring.flyway.enabled=true
# 与 dev/pre 对齐：显式声明迁移脚本位置与baseline 策略
# ⚠️ baseline-on-migrate 必须 false —— 若为 true 且库里已有表但无迁移历史，
#    Flyway 会把当前状态当作基线「标记为已迁移」，导致 V1/V2/V3 被静默跳过，
#    出现"迁移历史显示成功但表根本没建"的假绿。宁可启动失败也不能假绿。
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# 生产只输出 error，降低日志量与敏感信息泄露面
logging.level.root=error
logging.level.com.firestar=warn

# 生产端口固定 2025（与 CI / bin 脚本一致）
server.port=2025

# ---- 文件存储：OSS（生产专用桶 fire-star-prod，与 stage 物理隔离）----
# AK/SK 严禁写入本文件，必须由云效 Secrets / 环境变量注入。
firestar.storage.type=oss
firestar.storage.oss.endpoint=${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
firestar.storage.oss.bucket=${OSS_BUCKET:fire-star-prod}
firestar.storage.oss.access-key-id=${OSS_ACCESS_KEY_ID}
firestar.storage.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET}
firestar.storage.oss.base-dir=prod
# ---- 自定义域名 oss.snrthn.com ----
# ✅ 2026-10-16 实测：CNAME 已指向 fire-star-prod.oss-cn-beijing.aliyuncs.com，
#    即该域名已绑到本 profile 的桶，签名不会再 403。
# ⛔ 但仍未启用，原因是【证书未托管】：https 握手拿到的是区域默认证书
#    （CN=cn-beijing.oss.aliyuncs.com），SAN 不含 oss.snrthn.com，
#    Java 严格校验会直接 CERTIFICATE_VERIFY_FAILED；走 http 则财务文件明文传输，
#    且前端为 https 时会被浏览器按混合内容拦截——两条路都不成立。
#
# 启用步骤（控制台，一次即可）：
#   1) 数字证书管理服务 申请「个人测试证书(免费,90天)」或复用 snrthn.com 现有证书，
#      域名填 oss.snrthn.com，下载 PEM/KEY 格式；
#   2) OSS 控制台 → fire-star-prod → 传输管理 → 域名管理 → 证书托管 → 上传公钥+私钥；
#   3) 在 .env/prod.env 里把 OSS_PUBLIC_DOMAIN 一行取消注释（值必须是 https:// 开头）。
#
# 启用后收益：图片/PDF 可在线预览（默认域名会被强制加 Content-Disposition: attachment）。
# 不启用的影响：下载功能完全正常，仅图片无法在线预览（PDF 预览不受影响）。
firestar.storage.oss.public-domain=${OSS_PUBLIC_DOMAIN:}
firestar.storage.oss.sign-url-expire-minutes=10
